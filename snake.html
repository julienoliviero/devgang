<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --grid: #263449;
    --snake: #a855f7;
    --head: #d8b4fe;
    --food: #f43f5e;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: 0.1em; }
  .scores { display: flex; gap: 24px; color: var(--muted); }
  .scores b { color: var(--text); }
  .skin {
    padding: 24px;
    border-radius: 26px;
    background-color: #2e1065;
    background-image:
      radial-gradient(circle at 50% 100%, #c084fc 0 22%, #9333ea 24% 42%, #3b0764 44% 50%, transparent 52%),
      radial-gradient(circle at 50% 100%, #c084fc 0 22%, #9333ea 24% 42%, #3b0764 44% 50%, transparent 52%);
    background-size: 22px 16px;
    background-position: 0 0, 11px 8px;
    box-shadow:
      inset 0 0 0 2px #1e0a3c,
      inset 0 0 14px rgba(0,0,0,.6),
      0 0 30px rgba(168, 85, 247, .35),
      0 14px 40px rgba(0,0,0,.5);
    animation: slither 6s linear infinite;
  }
  @keyframes slither {
    to { background-position: 22px 0, 33px 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .skin { animation: none; } }
  .board {
    position: relative;
    width: min(calc(90vw - 48px), 420px);
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 0 0 3px #1e0a3c, 0 0 18px rgba(0,0,0,.7);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, .8);
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 24px;
    border: 0;
    border-radius: 8px;
    background: var(--snake);
    color: #2e1065;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .board { touch-action: none; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(3, 72px);
    gap: 8px;
  }
  .pad button {
    padding: 0;
    border-radius: 18px;
    background: linear-gradient(180deg, #7e22ce, #581c87);
    color: #f3e8ff;
    font-size: 1.6rem;
    box-shadow: 0 5px 0 #2e1065, 0 8px 16px rgba(0,0,0,.4);
    transition: transform .06s, box-shadow .06s;
    touch-action: none;
  }
  .pad button.pressed, .pad button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #2e1065, 0 3px 8px rgba(0,0,0,.4);
    filter: brightness(1.2);
  }
  .pad .up { grid-area: 1 / 2; }
  .pad .left { grid-area: 2 / 1; }
  .pad .pause { grid-area: 2 / 2; border-radius: 50%; font-size: 1.1rem; background: var(--panel); color: var(--muted); box-shadow: 0 4px 0 #0b1120; }
  .pad .right { grid-area: 2 / 3; }
  .pad .down { grid-area: 3 / 2; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; }
  .hint .touch { display: none; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  @media (hover: none), (pointer: coarse) {
    body { justify-content: flex-start; gap: 12px; padding-top: max(16px, env(safe-area-inset-top)); }
    h1 { font-size: 1.5rem; }
    .skin { padding: 14px; border-radius: 20px; }
    .board { width: min(calc(100vw - 60px), calc(100svh - 400px), 420px); min-width: 220px; }
    .hint .keys { display: none; }
    .hint .touch { display: inline; }
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="scores">
    <span>Score : <b id="score">0</b></span>
    <span>Record : <b id="best">0</b></span>
  </div>

  <div class="skin">
  <div class="board">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Prêt ?</h2>
      <p id="message">Mange les bananes, évite les murs et ta queue.</p>
      <button id="start">Jouer</button>
    </div>
  </div>
  </div>

  <div class="pad">
    <button class="up" data-dir="up" aria-label="Haut">▲</button>
    <button class="left" data-dir="left" aria-label="Gauche">◀</button>
    <button class="pause" id="pauseBtn" aria-label="Pause">❚❚</button>
    <button class="right" data-dir="right" aria-label="Droite">▶</button>
    <button class="down" data-dir="down" aria-label="Bas">▼</button>
  </div>
  <p class="hint">
    <span class="keys">Flèches ou ZQSD pour bouger · Espace pour pause</span>
    <span class="touch">Touches ou glisse le doigt sur le plateau</span>
  </p>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const CELLS = 21;
  const SIZE = canvas.width / CELLS;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let snake, dir, nextDir, food, score, speed, timer, running = false, paused = false;
  let best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [[mid, mid], [mid - 1, mid], [mid - 2, mid]];
    dir = nextDir = 'right';
    score = 0;
    speed = 130;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = [Math.floor(Math.random() * CELLS), Math.floor(Math.random() * CELLS)];
    } while (snake.some(([x, y]) => x === food[0] && y === food[1]));
  }

  function step() {
    dir = nextDir;
    const [dx, dy] = DIRS[dir];
    const head = [snake[0][0] + dx, snake[0][1] + dy];
    const ate = head[0] === food[0] && head[1] === food[1];
    const body = ate ? snake : snake.slice(0, -1);

    if (head[0] < 0 || head[1] < 0 || head[0] >= CELLS || head[1] >= CELLS ||
        body.some(([x, y]) => x === head[0] && y === head[1])) {
      return gameOver();
    }

    snake.unshift(head);
    if (ate) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(60, speed - 3);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(step, speed);
  }

  function cell(x, y, color, inset = 1, radius = 4) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x * SIZE + inset, y * SIZE + inset, SIZE - inset * 2, SIZE - inset * 2, radius);
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#263449';
    for (let x = 0; x < CELLS; x++)
      for (let y = 0; y < CELLS; y++)
        if ((x + y) % 2) ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);

    ctx.font = `${SIZE * 0.9}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍌', food[0] * SIZE + SIZE / 2, food[1] * SIZE + SIZE / 2 + 1);
    snake.forEach(([x, y], i) => cell(x, y, i === 0 ? '#d8b4fe' : '#a855f7'));
  }

  function start() {
    reset();
    draw();
    overlay.classList.add('hidden');
    running = true;
    paused = false;
    clearTimeout(timer);
    timer = setTimeout(step, speed);
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    titleEl.textContent = 'Perdu !';
    messageEl.textContent = `Score : ${score}`;
    startBtn.textContent = 'Rejouer';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      titleEl.textContent = 'Pause';
      messageEl.textContent = matchMedia('(pointer: coarse)').matches
        ? 'Touche ❚❚ pour reprendre.'
        : 'Appuie sur Espace pour reprendre.';
      startBtn.textContent = 'Reprendre';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      timer = setTimeout(step, speed);
    }
  }

  function turn(newDir) {
    const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (running && !paused && newDir !== opposite[dir]) nextDir = newDir;
  }

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    z: 'up', s: 'down', q: 'left', d: 'right',
    w: 'up', a: 'left'
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
      return;
    }
    const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (d) { e.preventDefault(); turn(d); }
  });

  startBtn.addEventListener('click', () => (running && paused ? togglePause() : start()));
  // Touch buttons react on pointerdown (no 300ms click delay, works with multiple fingers)
  document.querySelectorAll('.pad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      b.classList.add('pressed');
      if (navigator.vibrate) navigator.vibrate(10);
      if (b.dataset.dir) {
        if (!running) start();
        turn(b.dataset.dir);
      } else if (!running) {
        start();
      } else {
        togglePause();
      }
    });
    const release = () => b.classList.remove('pressed');
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('pointerleave', release);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // Swipe on the board: turns as soon as the finger has moved enough, no need to lift it
  let touchStart = null;
  const board = document.querySelector('.board');
  board.addEventListener('touchstart', (e) => {
    if (e.target === startBtn) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  board.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      touchStart = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });
  board.addEventListener('touchend', () => { touchStart = null; });

  reset();
  draw();
</script>
</body>
</html>
